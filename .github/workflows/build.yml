name: Build APK

on:
  push:
    branches:
      - buildozer-apk-workflow
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt update
        echo "Installing system dependencies..."
        sudo apt install -y build-essential libffi-dev python3-pip python3-setuptools python3-venv default-jdk wget unzip git
        pip install --upgrade pip
        echo "Installing Buildozer and Cython..."
        pip install buildozer cython
        echo "Verifying Buildozer installation..."
        ls ~/.local/bin
        which buildozer || echo "Buildozer executable path is not in PATH"

        # Set the PATH explicitly
        export PATH=$HOME/.local/bin:$PATH
        echo "Updated PATH: $PATH"
        which buildozer || (echo "Buildozer still not found in PATH" && exit 1)
        buildozer --version || echo "Buildozer installed but not functional"

        # Install Android SDK
        echo "Installing Android SDK..."
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O commandlinetools.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip commandlinetools.zip -d $HOME/android-sdk/cmdline-tools/
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/tools
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    - name: Build APK
      env:
        PATH: $HOME/.local/bin:$ANDROID_SDK_ROOT/cmdline-tools/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        ANDROID_SDK_ROOT: $HOME/android-sdk
      run: |
        echo "Building APK..."
        buildozer init
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-file
        path: bin/*.apk
